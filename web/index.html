<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gesture Drawing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div id="app">
    <div id="scene">
      <button id="mode-btn" aria-label="Switch game mode">🍉 Fruit Ninja</button>
      <div id="frame-wrapper">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="display-canvas"></canvas>
        <!-- pill lives inside frame on mobile -->
        <div id="pill"></div>
      </div>
      <button id="toggle-btn" aria-label="Toggle tracking"></button>
      <!-- touch-only draw button -->
      <button id="draw-btn" aria-label="Hold to draw">✏</button>
    </div>
  </div>

  <input type="file" id="image-upload" accept="image/*" hidden>
  <script type="module" src="app.js"></script>
</body>
</html>
